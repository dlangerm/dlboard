# A self-contained way to try the published image's default deployment (Postgres + local-disk
# artifacts, password sign-in -- see dltrack/scripts/docker_deployment.py) locally: `docker compose
# up` needs nothing else installed or configured, and both volumes below genuinely persist across
# `docker compose down`/`up` (no `-v`) -- verified by restarting the stack and checking the data is
# still there, not assumed. Swap `dltrack-postgres`/`dltrack-artifacts` for your own infrastructure,
# and DLTRACK_SECRET_KEY for a real one, before using this anywhere real. See docs/docker.md --
# including "Using an S3 artifact store instead" if you want one.

services:
  dltrack:
    build: .
    ports:
      - 8050:8050
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: dltrack
      POSTGRES_PASSWORD: dltrack
      POSTGRES_DATABASE: dltrack
      # Local-trial-only: generate a real one with `openssl rand -hex 32` for anything that outlives
      # `docker compose down`.
      DLTRACK_SECRET_KEY: local-trial-only-change-me
      # This stack is plain HTTP -- a `Secure` session cookie (the default) is dropped by most HTTP
      # clients on a non-HTTPS origin, which breaks sign-in outright. Never set this to false behind
      # real infrastructure; serve that over HTTPS instead (see docs/docker.md).
      DLTRACK_SECURE_COOKIES: 'false'
    volumes:
      - dltrack-artifacts:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dltrack
      POSTGRES_PASSWORD: dltrack
      POSTGRES_DB: dltrack
    volumes:
      - dltrack-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U dltrack]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  dltrack-postgres:
  dltrack-artifacts:
