# A self-contained way to try the published image's default deployment (Postgres + local-disk
# artifacts, password sign-in -- see dlboard/scripts/docker_deployment.py) locally: both volumes
# below genuinely persist across `docker compose down`/`up` (no `-v`) -- verified by restarting the
# stack and checking the data is still there, not assumed. The one thing this needs before `docker
# compose up` is a session secret in your shell (the server itself refuses to start without a real
# one -- a missing or placeholder DLBOARD_SECRET_KEY is exactly the kind of thing that's silently
# fine right up until it's a forgeable admin session on something real):
#
#   export DLBOARD_SECRET_KEY=$(openssl rand -hex 32)
#
# Swap `dlboard-postgres`/`dlboard-artifacts` for your own infrastructure before using this
# anywhere real. See docs/docker.md -- including "Using an S3 artifact store instead" if you want one.
#
# It also runs Grafana's all-in-one `otel-lgtm` image (Loki, Grafana, Tempo and Prometheus behind an
# OpenTelemetry collector) and has dlboard send its metrics, logs and traces there, so the stack shows what
# docs/telemetry.md describes: open http://localhost:3000 (no sign-in) and use Explore. The image is large
# (about 2.7 GB) and its data is not kept across `docker compose down`. To go without it, delete the `lgtm`
# service, its `depends_on` entry, and the DLBOARD_TELEMETRY_* / OTEL_* variables on `dlboard`.
# A training script on your machine joins the same traces with:
#
#   export DLBOARD_TELEMETRY_TRACES=true OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318

services:
  dlboard:
    build: .
    # After a reboot Docker starts every container at once: `depends_on` below only orders `docker compose up`, not
    # that. dlboard waits for its database itself (DLBOARD_STARTUP_WAIT_S), and this brings it back if it dies anyway.
    restart: unless-stopped
    # On `docker compose stop`/`down`, give the server time to write queued artifact blobs and
    # record them (DLBOARD_WORKERS_KILL_TIMEOUT_S, 30 by default) -- Docker's own 10s default would SIGKILL it first.
    stop_grace_period: 35s
    ports:
      - 8050:8050
    environment:
      DLBOARD_POSTGRES_HOST: postgres
      DLBOARD_POSTGRES_USER: dlboard
      DLBOARD_POSTGRES_PASSWORD: dlboard
      DLBOARD_POSTGRES_DATABASE: dlboard
      # Required -- see the top of this file. `:?` fails `docker compose up` immediately with a
      # clear message instead of starting the server with no key (or a placeholder it would refuse
      # to start with anyway).
      DLBOARD_SECRET_KEY: ${DLBOARD_SECRET_KEY:?see the export command at the 
        top of this file}
      # This stack is plain HTTP -- a `Secure` session cookie (the default) is dropped by most HTTP
      # clients on a non-HTTPS origin, which breaks sign-in outright. Never set this to false behind
      # real infrastructure; serve that over HTTPS instead (see docs/docker.md).
      DLBOARD_SECURE_COOKIES: 'false'
      # Telemetry, all opt-in (docs/telemetry.md): requests, ingest and database metrics, log events, and a
      # trace per request that continues a training script's. The image already has the `otel` extra.
      DLBOARD_TELEMETRY_METRICS: otlp
      DLBOARD_TELEMETRY_LOGS: 'true'
      DLBOARD_TELEMETRY_TRACES: 'true'
      # Where all three go: the collector inside `lgtm`, over OTLP/HTTP (4318; dlboard does not speak gRPC, 4317).
      # The standard OpenTelemetry variable adds /v1/traces, /v1/metrics and /v1/logs itself.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    volumes:
      - dlboard-artifacts:/data
    depends_on:
      postgres:
        condition: service_healthy
      # Not needed to run, but dlboard's first exports would otherwise race the collector's startup.
      lgtm:
        condition: service_healthy

  lgtm:
    image: grafana/otel-lgtm:latest
    restart: unless-stopped
    ports:
      - 3000:3000 # Grafana: Explore -> Tempo (traces), Prometheus (metrics), Loki (logs)
      - 4318:4318 # OTLP/HTTP, for a training script on your machine
    healthcheck:
      # The image writes this file once the collector and every backend are up.
      test: [CMD-SHELL, test -f /tmp/ready]
      interval: 3s
      timeout: 3s
      retries: 60
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: false
      GF_ANALYTICS_CHECK_FOR_UPDATES: false
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: false
      GF_NEWS_NEWS_FEED_ENABLED: false

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dlboard
      POSTGRES_PASSWORD: dlboard
      POSTGRES_DB: dlboard
    volumes:
      - dlboard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U dlboard]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  dlboard-postgres:
  dlboard-artifacts:
