# Prose linting for the Markdown docs (docs/, README.md, CHANGELOG.md), run by the `vale` pre-commit hook.
# The styles are vendored under `.vale/styles` (`vale sync` regenerates them), so the hook needs no network.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = Google
Vocab = dlboard

[*.md]
BasedOnStyles = Vale, Google
# Rules that flag how this repo's prose is written on purpose -- em dashes and parentheses for asides, semicolons,
# contractions, "we"/"you", passive voice, and the rest of the stylistic rules -- are off. The rules left on catch
# misspellings, unexplained acronyms, bad headings and banned words.
Google.Parens = NO
Google.EmDash = NO
Google.Semicolons = NO
Google.Passive = NO
Google.Contractions = NO
Google.FirstPerson = NO
Google.Ellipses = NO
Google.OxfordComma = NO
Google.Quotes = NO
Google.Colons = NO
Google.Will = NO
Google.Timeless = NO
Google.Exclamation = NO
