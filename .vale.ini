# Prose linting for the Markdown files, run by the `vale` pre-commit hook. The rules are Vale's own built-in `Vale`
# style (spelling, terms, repetition, avoided words), and this repo adds its vocabulary. The vocabulary is checked in, so the
# hook needs no network.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = dlboard

[*.md]
BasedOnStyles = Vale
