[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
  { name = "David Langerman", email = "dev.onyxzerosoftware@gmail.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]
dependencies = [
  "coolname>=5.0.0",
  "dltype>=0.16.0",
  # The real floor for `requires-python = ">=3.10"` below: numpy 2.3+ needs 3.11, and 2.5+ needs
  # 3.12 -- 2.2.x is numpy's last release line that still supports 3.10. Left otherwise unpinned
  # (no upper bound), so the resolver still picks the newest numpy that fits whichever interpreter
  # is actually installing this -- verified by installing into a real 3.10 venv, not just read off
  # numpy's own PyPI metadata.
  "numpy>=2.2.0",
  "pendulum>=3.2.0",
  "pillow>=12.3.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "requests>=2.32.0",
  "structlog>=26.1.0",
  "typing-extensions>=4.12.0"
]
description = "A pytorch_lightning-compatible logger client for dltrack, a free, self-hosted experiment-tracking server."
dynamic = ["version"]
keywords = ["experiment-tracking", "logging", "machine-learning", "mlops", "pytorch-lightning"]
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "dltrack"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
# Needed by `dltrack.client.dltrack_logger.DLTrackLogger`, the `pytorch_lightning.loggers.Logger`
# adapter. Nothing else under `dltrack.client`/`dltrack.models` needs it.
lightning = [
  "pytorch-lightning>=2.6.5"
]
# Run `dltrack serve ...` from this same install, instead of a separate `pip install dltrack-server`.
server = [
  "dltrack-server"
]

[project.urls]
Changelog = "https://github.com/dlangerm/dltrack/blob/main/CHANGELOG.md"
Documentation = "https://github.com/dlangerm/dltrack#readme"
Homepage = "https://github.com/dlangerm/dltrack"
Issues = "https://github.com/dlangerm/dltrack/issues"
Repository = "https://github.com/dlangerm/dltrack"

[tool.hatch.build.targets.sdist.hooks.custom]
# Same hook, registered again: a target-specific hook only runs for the target it's declared
# under, and without this an `sdist` build sees none of `../dltrack` -- only `pyproject.toml`/
# `hatch_build.py` themselves, since those are the only files actually inside this project
# directory. `uv build`'s default output (wheel + sdist) silently produced a near-empty sdist
# before this was added; now a wheel built *from* that sdist works the same as one built straight
# from the repo (verified by actually doing both and diffing their contents).
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.hooks.custom]
# No static `include`/`force-include` here -- see `hatch_build.py`'s docstring.
path = "hatch_build.py"

[tool.hatch.version]
# The single source of truth for both distributions' version -- see `dltrack/_version.py`.
path = "../dltrack/_version.py"

[tool.uv]
# `hatch_build.py` pulls this package's real source from `../dltrack` (see its docstring), which
# uv's own default cache key (`pyproject.toml`/`setup.py`/`setup.cfg` in *this* directory, nothing
# outside it) has no way to see -- so without this, `uv sync` leaves a stale editable install in
# place after a source-only change, until something else (a dependency bump, say) forces a rebuild.
# Declaring our own `cache-keys` replaces that default outright, so it's repeated here too.
cache-keys = [{ file = "pyproject.toml" }, { file = "hatch_build.py" }, { file = "../dltrack/**/*.py" }]

[tool.uv.sources]
dltrack-server = { workspace = true }
