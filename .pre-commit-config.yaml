default_language_version:
  python: python3.12


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: trailing-whitespace
        # ignore docker-compose.yml's trailing whitespace in the comments at the top, which are
        # intentionally formatted that way to be readable in the terminal.
        # ignore ci yml which conflicts with pretty-format yaml
        exclude: ^docker-compose\.yml$|^\.github/workflows/ci\.yml$
      - id: end-of-file-fixer
        # The vendored Vale styles are copied byte for byte from `vale sync`, so they are left as they are.
        exclude: ^\.vale/
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix, lf]
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: name-tests-test
      - id: pretty-format-json
        args:
          - --autofix
          - --indent=2
        # biome.json is Biome's own config -- Biome reformats it to its own indent width
        # regardless of `files.includes`, which otherwise fights this hook's --indent=2.
        exclude: ^biome\.json$
  - repo: https://github.com/astral-sh/ruff-pre-commit
      # Ruff version.
    rev: v0.15.0
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
      - id: pretty-format-yaml
        args: [--autofix, --indent, '2', --offset, '2', --line-width, '80']
        exclude: ^\.vale/
      - id: pretty-format-toml
        args: [--autofix, --indent, '2']
        exclude: uv.lock
  - repo: https://github.com/astral-sh/uv-pre-commit
      # uv version.
    rev: 0.10.0
    hooks:
      - id: uv-lock
  - repo: https://github.com/biomejs/pre-commit
      # Lints/formats the browser-side JS in dlboard/**/assets/ (see biome.json). Runs in an
      # isolated node environment pre-commit provisions itself -- no system Node/npm required.
    rev: v2.5.10
    hooks:
      - id: biome-check

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture

  - repo: local
    hooks:
      - id: license-files-match
        # `client/LICENSE` and `server/LICENSE` are copies, not symlinks (a symlink doesn't survive
        # into a built wheel) -- PyPI's `license-files` validation rejects a path like `../LICENSE`
        # that escapes the project directory, so each side needs its own copy of the root file.
        name: client/server LICENSE copies match the root one
        language: system
        entry: bash -c 'cmp LICENSE client/LICENSE&&cmp LICENSE server/LICENSE'
        files: ^(LICENSE|client/LICENSE|server/LICENSE)$
        pass_filenames: false
      - id: server-client-pin-matches-version
        # The server wheel must pull in a `dlboard-client` of its own major.minor, so the two never skew in
        # one install. Like any autofixing hook, it rewrites the pin in `server/pyproject.toml` when it
        # drifted from `dlboard/_version.py` (so the run fails once, until you stage it), and fails outright
        # when there isn't exactly one `dlboard-client` dependency to rewrite. See the script.
        name: server's dlboard-client pin matches the version's major.minor
        language: system
        entry: uv run --no-project python tools/check_server_client_pin.py
        files: ^(dlboard/_version\.py|server/pyproject\.toml)$
      - id: pyrefly
        # Type-checks the whole project (see `[tool.pyrefly]` in pyproject.toml) -- it's fast enough (~2s)
        # to run on every commit, and it needs the project's own environment, so it runs through `uv run`.
        name: pyrefly type check
        language: system
        entry: uv run pyrefly check
        files: \.pyi?$|^pyproject\.toml$
        pass_filenames: false
      - id: install-tag-guard
        # Git has no pre-tag hook, but its `reference-transaction` hook can veto the ref update `git tag`
        # makes. prek can't install that hook type, so this links `tools/tag_guard.py` in as
        # `.git/hooks/reference-transaction` the first time any commit runs the hooks, which is what makes
        # a `vX.Y.Z` tag that disagrees with `dlboard/_version.py` impossible to create locally. Silent
        # once installed; fails (rather than overwrites) if some other hook of that name is already there.
        name: tag guard for vX.Y.Z release tags is installed
        language: system
        entry: uv run --no-project python tools/tag_guard.py --install
        always_run: true
        pass_filenames: false
      - id: forbid-strings
        # Checks Python files for forbidden strings, like the builtin `print` or `pdb` breakpoints. It also removes
        # ignore comments that excuse nothing, as ruff does for `noqa`. See the script.
        name: forbid certain strings in code
        language: system
        entry: uv run --no-project python tools/forbid_strings.py
        args: [--fix]
        types_or: [python, pyi]
        pass_filenames: true
      - id: vale
        # Lints the prose of the Markdown files against `.vale.ini` (the Google style and this repo's vocabulary, both
        # checked in under `.vale/styles`). It runs the Vale binary, which isn't a Python package: see CONTRIBUTING.md.
        # CLAUDE.md is instructions for agents, and CODE_OF_CONDUCT.md is upstream text, so neither is linted.
        name: vale (prose in the Markdown)
        language: system
        entry: vale --output=line
        types: [markdown]
        exclude: ^(CLAUDE|CODE_OF_CONDUCT)\.md$
      - id: one-sentence-per-line
        # Keeps each sentence of Markdown prose on its own line (see tools/one_sentence_per_line.awk for what counts).
        # Vale has no such rule in its built-in style, so this is a small awk check instead.
        name: one sentence per line in the Markdown
        language: system
        entry: awk -v mode=check -f tools/one_sentence_per_line.awk
        types: [markdown]
        exclude: ^(CLAUDE|CODE_OF_CONDUCT)\.md$
