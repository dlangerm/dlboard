default_language_version:
  python: python3.12


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix, lf]
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: name-tests-test
      - id: pretty-format-json
        args:
          - --autofix
          - --indent=2
        # biome.json is Biome's own config -- Biome reformats it to its own indent width
        # regardless of `files.includes`, which otherwise fights this hook's --indent=2.
        exclude: ^biome\.json$
  - repo: https://github.com/astral-sh/ruff-pre-commit
      # Ruff version.
    rev: v0.15.0
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
      - id: pretty-format-yaml
        args: [--autofix, --indent, '2', --offset, '2', --line-width, '80']
      - id: pretty-format-toml
        args: [--autofix, --indent, '2']
        exclude: uv.lock
  - repo: https://github.com/astral-sh/uv-pre-commit
      # uv version.
    rev: 0.10.0
    hooks:
      - id: uv-lock
  - repo: https://github.com/biomejs/pre-commit
      # Lints/formats the browser-side JS in dltrack/**/assets/ (see biome.json). Runs in an
      # isolated node environment pre-commit provisions itself -- no system Node/npm required.
    rev: v2.5.10
    hooks:
      - id: biome-check

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
