name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run prek run --all-files --skip no-commit-to-branch
      - run: uv run pyright

  test:
    needs: [typecheck-precommit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run pytest -m "not browser and not postgres" --cov
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser
      - run: uv run pytest --screenshots=check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doc-screenshots
          path: screenshot-diffs/
          if-no-files-found: ignore

  # The store suite, soft-delete/purge, and the client -> REST -> store end-to-end test, against a
  # real Postgres: testcontainers starts one in Docker (preinstalled on GitHub's Ubuntu runners), the
  # same way `uv run pytest -m postgres` does locally.
  test-postgres:
    needs: [typecheck-precommit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run pytest -m postgres
