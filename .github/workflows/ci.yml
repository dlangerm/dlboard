name: CI

on:
  push:
    branches: [main]
  # Every PR, not just ones into main: a stacked PR targets the branch below it.
  pull_request:

# Read-only for every job unless a job asks for more itself (`publish-image` does, for ghcr.io).
permissions:
  contents: read

# A newer push cancels a branch's run in progress, but never main's: landing a stack pushes main several
# times in a row, and cancelling each run for the next left `latest` behind the head for hours. Main's runs
# queue instead (GitHub keeps only the newest of the waiting ones), so the head's run always completes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check_doc_only:
    runs-on: ubuntu-latest
    outputs:
      skip-tests: ${{ steps.check_doc_only.outputs.skip-tests }}
    steps:
      # A PR checkout is a merge commit, so HEAD^1..HEAD is exactly the PR's changes whatever branch
      # it targets (stacked PRs included); depth 2 is enough to see its first parent.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check_doc_only
        name: Check if PR touches only documentation files
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && ! git diff --name-only HEAD^1 HEAD | grep -qvE '(^_config\.yml$|\.md$)'; then
            echo "PR touches only doc files; will skip tests"
            echo "skip-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "will run tests"
            echo "skip-tests=false" >> "$GITHUB_OUTPUT"
          fi

  typecheck-precommit:
    needs: [check_doc_only]
    runs-on: ubuntu-latest
    if: needs.check_doc_only.outputs.skip-tests != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: uv run prek run --all-files --skip no-commit-to-branch
      - run: uv run pyrefly check

  test:
    needs: [check_doc_only, typecheck-precommit]
    runs-on: ubuntu-latest
    # Reruns the tests this job's suite failed, and files an issue for each flaky one.
    permissions:
      contents: read
      issues: write
    if: needs.check_doc_only.outputs.skip-tests != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: |
          uv run pytest -m "not browser and not postgres and not s3" --cov --maxfail=3
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser -x
      - run: uv run pytest --screenshots=check
      - if: failure()
        uses: ./.github/actions/recheck-failures
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doc-screenshots
          path: screenshot-diffs/
          if-no-files-found: ignore

  # The store suite, soft-delete/purge, and the client -> REST -> store end-to-end test, against a
  # real Postgres: testcontainers starts one in Docker (preinstalled on GitHub's Ubuntu runners), the
  # same way `uv run pytest -m postgres` does locally.
  test-postgres:
    if: needs.check_doc_only.outputs.skip-tests != 'true'
    needs: [check_doc_only, typecheck-precommit]
    runs-on: ubuntu-latest
    # Reruns the tests this job's suite failed, and files an issue for each flaky one.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: uv run pytest -m postgres -x
      - if: failure()
        uses: ./.github/actions/recheck-failures

  # The S3 artifact store, against a real S3-protocol endpoint (LocalStack, in Docker) -- the same
  # way `uv run pytest -m s3` does locally. See `dlboard/conftest.py`'s `s3_test_server`.
  test-s3:
    if: needs.check_doc_only.outputs.skip-tests != 'true'
    needs: [check_doc_only, typecheck-precommit]
    runs-on: ubuntu-latest
    # Reruns the tests this job's suite failed, and files an issue for each flaky one.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: uv run pytest -m s3 -x
      - if: failure()
        uses: ./.github/actions/recheck-failures

  # Confirms the client actually installs and imports on every Python version
  # `client/pyproject.toml`'s `requires-python = ">=3.10"` claims -- nothing else does: the repo's
  # own dev environment (and so every other job above) only ever runs on `.python-version`'s 3.12,
  # which numpy alone (`client/pyproject.toml`'s own comment) was once enough to silently break.
  client-compat:
    if: needs.check_doc_only.outputs.skip-tests != 'true'
    needs: [check_doc_only, typecheck-precommit]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build --package dlboard-client --wheel --out-dir dist
      - run: uv venv --python ${{ matrix.python-version }} client-venv
      - run: uv pip install --python client-venv/bin/python dist/*.whl
      - run: >
          client-venv/bin/python -c
          "import dlboard, dlboard.client, dlboard.client.artifacts.image, dlboard.models"

  # The client's `otel` extra promises a floor and no ceiling, so a user's own OpenTelemetry is never forced to move
  # for dlboard. This installs the extra three ways -- every direct requirement at its floor, the newest releases,
  # and an old protobuf (torch/TensorFlow environments) -- and runs the client's real tracing against a collector.
  # Installed from `pyproject.toml`'s own requirements: `--resolution lowest-direct` only floors *direct* ones, and
  # through the wheel's extra they would be transitive and resolve to the newest.
  client-otel:
    if: needs.check_doc_only.outputs.skip-tests != 'true'
    needs: [check_doc_only, typecheck-precommit]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python-version: '3.10', resolution: lowest-direct, pin: ''}
          - {python-version: '3.10', resolution: highest, pin: protobuf==3.20.*}
          - {python-version: '3.13', resolution: highest, pin: ''}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build --package dlboard-client --wheel --out-dir dist
      - run: uv venv --python ${{ matrix.python-version }} client-venv
      - run: >
          uv pip install --python client-venv/bin/python --resolution ${{ matrix.resolution
          }}
          -r client/pyproject.toml --extra otel ${{ matrix.pin }}
      - run: uv pip install --python client-venv/bin/python --no-deps dist/*.whl
      - run: client-venv/bin/python tools/check_client_tracing.py

  # Build-only: proves the root `Dockerfile`'s multi-stage build still produces a working
  # dlboard image. Not pushed anywhere -- just a build sanity check on every PR.
  # The layer cache is an optimization, so failing to write it (a run of an already merged PR gets a
  # read-only cache token) must not fail the build: `ignore-error`.
  docker-build:
    if: needs.check_doc_only.outputs.skip-tests != 'true'
    needs: [check_doc_only, typecheck-precommit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # Publishes the image once a change has landed on main and the test suite passed on it. `stable` and
  # the version tags belong to release.yml. PRs only get `docker-build` above.
  publish-image:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Main's runs queue, so one can get here after a newer push landed, or be rerun by hand long
      # after: only main's head may move `latest`, or it would move backwards.
      - id: head
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$GITHUB_SHA is no longer the head of main; its image is not published."
          fi
      - if: steps.head.outputs.current == 'true'
        uses: ./.github/actions/push-image
        with:
          tags: |
            type=raw,value=latest
            type=raw,value=beta
            type=sha,prefix=sha-

  # A job that failed on main is an incident, not noise: people run what main builds. Files the issue
  # that starts "When main is red" in CONTRIBUTING.md; `image-freshness.yml` is the backstop for what
  # this cannot see (a run that never finished).
  report-main-failure:
    needs:
      - typecheck-precommit
      - test
      - test-postgres
      - test-s3
      - client-compat
      - client-otel
      - docker-build
      - publish-image
    if: always() && github.event_name == 'push' && contains(needs.*.result, 
      'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository 
            }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "CI failed on main at ${GITHUB_SHA::7}" \
            --body "A job failed on the push of $GITHUB_SHA to main: $RUN_URL

          Follow \"When main is red\" in CONTRIBUTING.md: triage it, and until it is fixed or reverted the
          \`latest\`/\`beta\` images do not include this commit."
