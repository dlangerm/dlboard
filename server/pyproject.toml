[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
dependencies = [
  "alembic>=1.13",
  "cyclopts>=4.23.2",
  "dash>=4.4.1",
  "dash-ag-grid>=35.3.0",
  "dash-mantine-components>=2.8.0",
  "dltrack",
  "granian>=2.8.2",
  "pandas>=3.0.5",
  "pendulum>=3.2.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "rich>=15.0.0",
  "sqlalchemy>=2.0.40",
  "structlog>=26.1.0"
]
description = "dltrack's server: the Dash app, storage/auth plugins, and the `dltrack` CLI."
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["../LICENSE"]
name = "dltrack-server"
requires-python = ">=3.12"

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2"
]
s3 = [
  "boto3>=1.40"
]

[project.scripts]
dltrack = "dltrack._cli:main"

[tool.hatch.build.targets.wheel.hooks.custom]
# No static `include`/`force-include` here -- this hook populates `force_include` itself, since
# the static form has no way to exclude `tests/`/`_tests/` from a force-included directory
# (`[tool.hatch.build] exclude` doesn't apply to it at all).
path = "hatch_build.py"

[tool.hatch.version]
# The single source of truth for both distributions' version -- see `dltrack/_version.py`. Kept in
# lockstep with the `dltrack` dependency above only informally for now (both are bumped by the same
# release); pinning that dependency to this exact version is a release-process concern, not this one.
path = "../dltrack/_version.py"

[tool.uv]
# `hatch_build.py` pulls this package's real source from `../dltrack` (see its docstring), which
# uv's own default cache key (`pyproject.toml`/`setup.py`/`setup.cfg` in *this* directory, nothing
# outside it) has no way to see -- so without this, `uv sync` leaves a stale editable install in
# place after a source-only change, until something else (a dependency bump, say) forces a rebuild.
# Declaring our own `cache-keys` replaces that default outright, so it's repeated here too.
cache-keys = [{ file = "pyproject.toml" }, { file = "hatch_build.py" }, { file = "../dltrack/**/*.py" }]

[tool.uv.sources]
dltrack = { workspace = true }
