<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · dlboard</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8f9fa;
      --card: #fff;
      --fg: #212529;
      --dim: #6c757d;
      --line: #dee2e6;
      --accent: #228be6;
      --bad: #e03131;
      --good: #2f9e44;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1b1e;
        --card: #25262b;
        --fg: #c1c2c5;
        --dim: #909296;
        --line: #373a40;
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      width: min(360px, calc(100vw - 32px));
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 28px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 4px;
    }

    .brand {
      color: var(--dim);
      font-size: 13px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin: 14px 0 4px;
    }

    input[type=text],
    input[type=password] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: inherit;
      font: inherit;
    }

    .check {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 14px;
      font-size: 14px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 9px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .error {
      color: var(--bad);
      font-size: 14px;
      margin-top: 14px;
    }

    .message {
      color: var(--good);
      font-size: 14px;
      margin-top: 14px;
    }

    .footer {
      margin-top: 18px;
      font-size: 13px;
      color: var(--dim);
      text-align: center;
    }

    a {
      color: var(--accent);
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">dlboard</div>
    <h1>{{ title }}</h1>
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      {% for field in fields %}
      {% if field.input_type == "checkbox" %}<label class="check"><input type="checkbox" name="{{ field.name }}"> {{
        field.label }}</label>
      {% else %}<label for="{{ field.name }}">{{ field.label }}</label>
      <input id="{{ field.name }}" name="{{ field.name }}" type="{{ field.input_type }}" required
        autocomplete="{{ field.autocomplete }}">
      {% endif %}{% endfor %}
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      {% if message %}<div class="message">{{ message }}</div>{% endif %}
      <button type="submit">{{ submit }}</button>
    </form>
    {% if footer %}<div class="footer">{{ footer.text }} <a href="{{ footer.href }}">{{ footer.link_text }}</a></div>{%
    endif %}
  </main>
</body>

</html>
