[dependency-groups]
dev = [
  "pandas-stubs>=3.0.5.260730",
  "prek>=0.4.10",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.22",
  "torchvision>=0.28.0"
]

[project]
dependencies = [
  "dash>=4.4.1",
  "dash-mantine-components>=2.8.0",
  "dltype>=0.16.0",
  "numpy>=2.5.1",
  "pandas>=3.0.5",
  "pendulum>=3.2.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "pytorch-lightning>=2.6.5",
  "rich>=15.0.0",
  "structlog>=26.1.0"
]
description = "What if mlflow didn't suck and weights & biases was free?"
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "dltrack"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "\\.\\.\\."
]
skip_covered = false

[tool.coverage.run]
branch = true
source = ["dltrack"]

[tool.pyright]
include = ["dltrack", "tests"]
reportMissingTypeStubs = false
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedFunction = false
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
indent-width = 4
line-length = 110
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
line-ending = "lf"

[tool.ruff.lint]
extend-select = [
  "ANN",
  "ARG",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "D",
  "E",
  "EM",
  "ERA",
  "F",
  "FA",
  "FBT",
  "G",
  "I",
  "ICN",
  "INP",
  "ISC",
  "LOG",
  "N",
  "NPY",
  "PERF",
  "PIE",
  "PLE",
  "PLR",
  "PT",
  "PTH",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "SIM",
  "SLF",
  "T20",
  "TC",
  "TID",
  "TRY",
  "W"
]
fixable = ["ALL"]
ignore = ["COM812", "D203", "D212", "D401", "E501", "PLR6301", "PLR0917"]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"dltype/tests/*" = ["D", "ARG", "FBT", "PLR2004", "T201"]
"tests/*" = ["D", "ARG", "FBT", "PLR2004", "T201", "SLF001", "INP001"]
