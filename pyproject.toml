# A virtual workspace root: no `[project]` table of its own, on purpose -- `client/` (the
# `dlboard-client` distribution) and `server/` (`dlboard`) are the two real packages, both built
# from this one shared `dlboard/` source tree (see their own `pyproject.toml`s and
# `hatch_build.py`s). A virtual root is what makes bare `uv run`/`uv sync` default to every
# workspace member instead of just one, so every command below (and in CLAUDE.md) keeps working
# unchanged -- a `[project]` table here would make this directory an explicit, single default
# target instead.

[dependency-groups]
dev = [
  "boto3>=1.40",
  # Test-only: `client.artifacts.figure` takes anything with matplotlib's `savefig` signature
  # structurally, so neither distribution depends on it -- but its tests render real figures.
  "matplotlib>=3.10",
  # Test-only: the `otel` extra of `dlboard` (`server/pyproject.toml`), installed so the telemetry tests run.
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-exporter-prometheus>=0.46b0",
  "opentelemetry-sdk>=1.25",
  "pandas-stubs>=3.0.5.260730",
  "prek>=0.4.10",
  # `DeviceStatsMonitor(cpu_stats=True)` (used by `examples/lightning_advanced.py`) reads CPU stats through it.
  "psutil>=7.2.2",
  "psycopg[binary]>=3.2",
  "pyrefly>=1.3.2",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-playwright>=0.9.0",
  # Not a real dependency of the `dlboard` distribution -- `client/pyproject.toml`'s
  # `[project.optional-dependencies] lightning` is that, for an actual `dlboard[lightning]`
  # consumer. This repo's own test suite (and `examples/lightning_quickstart.py`) exercises the Lightning adapter
  # directly, so it needs installing without anyone having to remember `--extra lightning`.
  "pytorch-lightning>=2.6.5",
  "ruff>=0.15.22",
  "testcontainers[localstack,postgres]>=4.10",
  "torchvision>=0.28.0",
  "types-boto3[s3]>=1.40",
  "vulture>=2.16"
]

[tool.alembic]
# So the bare `alembic` CLI (`revision --autogenerate`, `history`, ...) works from the repo root
# with no `alembic.ini` -- `_schema_upgrade.py` and `migrations/env.py` build their own `Config`
# and never read this section themselves. A developer authoring a new revision still needs
# `DLBOARD_MIGRATIONS_URL` set (see `migrations/env.py`), since there's no database to default to.
script_location = "dlboard/serve/_backend/migrations"

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\."]
skip_covered = false

[tool.coverage.run]
branch = true
source = ["dlboard"]

[tool.pyrefly]
infer-with-first-use = false
project-includes = ["dlboard"]

# Pyrefly has no single `strict` switch, so the error kinds that pyright's strict mode turned on are
# listed here by hand. `untyped-import` stays off, so third-party packages without type information don't error.
[tool.pyrefly.errors]
deprecated = "error"
implicit-any = "error"
implicit-any-attribute = "error"
implicit-any-empty-container = "error"
implicit-any-lambda = "error"
implicit-any-parameter = "error"
implicit-any-type-argument = "error"
implicit-reexport = "error"
missing-override-decorator = "error"
redundant-cast = "error"
redundant-condition = "error"
unannotated-attribute = "error"
unannotated-parameter = "error"
unannotated-return = "error"
unknown-argument-type = "error"
unknown-attribute-type = "error"
unknown-variable-type = "error"
unnecessary-comparison = "error"
unnecessary-type-conversion = "error"
untyped-import = "ignore"
unused-ignore = "error"

[tool.pytest.ini_options]
filterwarnings = [
  "error",
  # `LocalStackContainer.start()` (`s3_test_server`, `dlboard/conftest.py`) calls testcontainers'
  # own legacy `wait_for_logs(container, "<regex>")` internally -- nothing we call directly, and
  # not actionable from here.
  "ignore:The wait_for_logs function with string or callable predicates is deprecated:DeprecationWarning",
  # The many short-lived apps the suite builds each hold multiprocessing semaphores (their artifact store's
  # queues and events), freed whenever the cyclic GC gets to them. When that lands inside another call into
  # the resource tracker, Python 3.12+ declines the reentrant cleanup with this warning: harmless here (the
  # tracker cleans up at exit), but under "error" it fails whichever test happens to be running.
  "ignore:ResourceTracker called reentrantly for resource cleanup:UserWarning"
]
markers = [
  # `short`/`medium`/`long`/`huge` are applied automatically from `test-durations.json` (see `dlboard/conftest.py`).
  "short: test took 10s or less in the last recorded run",
  "medium: test took over 10s in the last recorded run",
  "long: test took over 30s in the last recorded run",
  "huge: test took over 60s in the last recorded run; the suite may have at most 5",
  "browser: browser-based end-to-end tests requiring a webdriver",
  "postgres: runs against a real Postgres in a throwaway container; needs Docker",
  "s3: runs against a real S3-compatible store (MinIO) in a throwaway container; needs Docker",
  "screenshots: renders the docs screenshots; only runs with --screenshots=check|update"
]
pythonpath = ["."]
testpaths = ["dlboard"]

[tool.ruff]
indent-width = 4
line-length = 110
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
line-ending = "lf"

[tool.ruff.lint]
extend-select = [
  "ANN",
  "ARG",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "D",
  "E",
  "EM",
  "ERA",
  "F",
  "FA",
  "FBT",
  "G",
  "I",
  "ICN",
  "INP",
  "ISC",
  "LOG",
  "N",
  "NPY",
  "PERF",
  "PIE",
  "PLE",
  "PLR",
  "PT",
  "PTH",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "SIM",
  "SLF",
  "T20",
  "TC",
  "TID",
  "TRY",
  "W"
]
fixable = ["ALL"]
ignore = ["COM812", "D203", "D212", "D401", "E501", "PLR6301", "PLR0917"]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.flake8-bugbear]
# `attribute()` is a dataclass `field()` with a label name, so it is as safe in a dataclass default as `field` is.
extend-immutable-calls = ["dlboard._telemetry.attribute"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Reading the clock and building or converting times goes through pendulum. `datetime.datetime` itself stays
# allowed as a type (pydantic's `AwareDatetime` is one, and pendulum's `DateTime` subclasses it), and so does
# `timedelta`.
"datetime.UTC".msg = "Use pendulum: `pendulum.UTC`, or `tz=\"UTC\"` on a pendulum constructor."
"datetime.date.today".msg = "Use `pendulum.today(...)`."
"datetime.datetime.fromisoformat".msg = "Use `pendulum.parse(...)`."
"datetime.datetime.fromtimestamp".msg = "Use `pendulum.from_timestamp(...)`."
"datetime.datetime.now".msg = "Use `pendulum.now(...)`."
"datetime.datetime.strptime".msg = "Use `pendulum.from_format(...)`."
"datetime.datetime.today".msg = "Use `pendulum.today(...)`."
"datetime.datetime.utcfromtimestamp".msg = "Use `pendulum.from_timestamp(..., tz=\"UTC\")`."
"datetime.datetime.utcnow".msg = "Use `pendulum.now(\"UTC\")`."
"datetime.timezone".msg = "Use a pendulum timezone: `pendulum.UTC`, `pendulum.timezone(...)`."

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves these classes' field annotations at runtime, so what they annotate with has to
# be importable at runtime too -- never moved into a `TYPE_CHECKING` block.
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "pydantic_settings.BaseSettings"
]

[tool.ruff.lint.per-file-ignores]
# `_pages/_tests/` (underscore-prefixed, unlike every other `tests/` dir) exists only so Dash's
# `pages_folder` scanner prunes it the same way it prunes every other implementation module under
# `_pages/` -- see CLAUDE.md's testing-conventions section. Same relaxed rules apply to it as to
# every other tests dir.
"**/{tests,_tests}/*" = [
  "D",
  "ARG",
  "FBT",
  "PLR2004",
  "T201",
  "SLF001",
  "INP001"
]
"dlboard/scripts/*" = ["T201"]
# A standalone runnable example, not a package -- never imported, so no `__init__.py` is needed.
"examples/*" = ["INP001", "T201"]
# Repo tooling run by pre-commit hooks, not part of any package.
"tools/*" = ["INP001"]
# `client/`/`server/`'s own build-time scripts, not `dlboard/`'s -- standalone hatchling hooks,
# never imported as part of either package.
"{client,server}/hatch_build.py" = ["INP001"]

[tool.uv.workspace]
# `client/` is `dlboard-client` (the client + shared models) and `server/` is `dlboard` (the Dash
# app, storage/auth plugins, and the `dlboard` CLI) -- both built from different subsets of this
# one shared `dlboard/` tree (see each one's own `hatch_build.py`). One repo, one source tree, two
# distributions: a client-only install never needs dash, granian, or sqlalchemy, and the published
# server image never needs torch.
members = ["client", "server"]

[tool.vulture]
# Deliberately does NOT exclude `tests/`: dlboard is a library as much as an application, and for
# a fair few public methods (`DataStore.update_user`, `_sampling.downsample_grouped`,
# `DLBoardLogger.from_names`, ...) the only caller in this repo *is* their own test -- excluding
# tests would make those look dead instead of correctly "used, just not yet from our own code".
exclude = []
ignore_decorators = [
  # Dash callbacks (`_backend/`, page plugins, `serve/app.py`'s navbar/breadcrumb wiring) --
  # every one is dispatched by Dash internally via the `Output`/`Input` ids passed to the
  # decorator, never called by name from our own code.
  "@callback",
  "@app.callback",
  "@dash.callback",
  "@*.clientside_callback",
  # Dash's plugin-hooks system (`dash.hooks` -- `@hooks.error()`, `@hooks.route()`, ...),
  # dispatched by Dash the same way, off the hook name rather than an Output/Input id.
  "@hooks.*",
  # Flask's own request-lifecycle hooks (`_request_logging.py`) -- dispatched by Flask itself
  # around every request/response, never called by name from our own code.
  "@*.before_request",
  "@*.after_request",
  "@*.teardown_request",
  # cyclopts CLI commands (`_cli.py`, `scripts/dev_harness.py`) -- dispatched by cyclopts from
  # the command line, never called by name from our own code.
  "@*.command",
  # pytest fixtures -- dispatched by pytest via dependency injection (a test's parameter name
  # matching the fixture name), never called by name directly.
  "@pytest.fixture",
  # Pydantic validators -- called by pydantic during (de)serialization/validation, never by a
  # literal call in our own code (`_view.py`'s `deserialize_json`, `image.py`'s
  # `_move_image_to_cpu`, ...).
  "@field_validator",
  "@model_validator",
  "@*field_serializer",
  # Marks a method as fulfilling a base class/Protocol contract (`ChartType.render`,
  # `DataStore.*`, `pytorch_lightning.loggers.Logger.name`/`.version`, ...) -- by definition
  # something else (often an external framework, e.g. Lightning calling `logger.version`)
  # dispatches it polymorphically, not a literal call vulture's static analysis can see. Removing
  # an `@override` method changes the class's contract regardless of whether *this* codebase
  # happens to call it today, so it isn't "dead" in the disposal sense even when flagged.
  "@override",
  "@typing.override",
  # Flasks g. object -- a request-scoped namespace Flask itself reads/writes, never called by name from our own code.
  "g.*"
]
ignore_names = [
  # `plugins/auth/password.py`'s `_Field`/`_Footer` NamedTuple members -- read by `password_form.html` (Jinja attribute
  # access), never by a Python `.name` vulture can see.
  "input_type",
  "autocomplete",
  "link_text",
  # `PluginProtocol.plug(app: Dash) -> None` -- every plugin module's install hook, called
  # structurally as `plugin.plug(app)` off whatever module a deployment's plugin list supplies
  # (see `dlboard.serve.resolve_plugins`/`dlboard.serve.app.app`), never by a literal `.plug(`
  # call vulture's static analysis can see.
  "plug",
  # `dash.register_page`'s per-route module contract (`serve/_pages/*.py`) -- Dash's page
  # registry looks this up via `getattr(module, "layout")` at routing time, not a call in our
  # own code.
  "layout",
  # `flask.session.permanent` (`_auth.start_session`) -- a flag Flask itself reads when it saves the session.
  "permanent",
  # `Flask.session_interface` (`_auth.install_request_gate`) -- the attribute Flask looks up to open and save every session.
  "session_interface",
  # pytest's module-level marker convention (`pytestmark = pytest.mark.browser`) -- applied by
  # pytest itself scanning the module namespace, never referenced by name in our own code.
  "pytestmark",
  # pytest's own conftest hooks (`dlboard/conftest.py`) -- discovered and called by pytest by name.
  "pytest_addoption",
  "pytest_collection_modifyitems",
  "pytest_configure",
  "pytest_runtest_makereport",
  "pytest_sessionfinish",
  # Pydantic model fields that are read structurally (raw SQL column names, `model_dump()`
  # serialization to REST clients, schema-generation reflection) rather than through a literal
  # `.name` attribute access vulture's static analysis can see -- not dead, just never accessed
  # the one way vulture looks for. Named individually (not a broader confidence/exclude change)
  # so a genuinely dead field of some other name still gets caught.
  "created_at",
  "requested_at",
  "updated_at",
  "bootstrap_admin_assigned",
  # `ViewFile.dlboard_view` (`serve/_pages/_experiment/_views.py`): an exported view's format
  # version, only ever checked by its own `Literal[1]` validation on import.
  "dlboard_view",
  # `serve/_backend/tests/sql_functions_test.py`'s throwaway schema-reflection model fields --
  # same "read structurally, not by attribute" story as above, scoped to their test models.
  "created",
  "parent_id",
  "score",
  # `client/tests/dlboard_logger_test.py`'s throwaway hyperparameter config classes -- their fields
  # are only ever read by pydantic's serializer inside `flatten_hparams`, same "read structurally,
  # not by attribute" story as above, scoped to that test's models.
  "betas",
  "warmup",
  "flip",
  "schedule",
  "renamed",
  # SQLAlchemy's `TypeDecorator` contract (`_sql.UTCDateTime`) -- class attributes SQLAlchemy reads
  # off the type itself, never referenced by name in our own code.
  "impl",
  "cache_ok",
  # Pydantic's class-level config attribute (`postgres.PostgresSettings`) -- read by pydantic itself.
  "model_config",
  # `plugins/charts/histogram.py`'s `_CategoryAxis` and `_Trace` keys -- Plotly property names, handed to Plotly as plain data
  # rather than read by attribute.
  "categoryorder",
  "categoryarray",
  "tickmode",
  "tickvals",
  "ticktext",
  "xaxis",
  "yaxis",
  "zmin",
  "zmax",
  "showscale",
  "colorbar",
  "hoverinfo",
  "fillcolor",
  "hovertemplate",
  # `plugins/backend/tests/rest_backend_test.py`'s `_FakeServer.add_url_rule` -- a keyword-only
  # parameter that has to keep this exact name to stand in for the real `Flask.add_url_rule`
  # signature, even though the fake's body never reads it.
  "endpoint",
  # Alembic's revision-script contract (`serve/_backend/migrations/versions/*.py`): every
  # revision module is read by these exact module-level names and this exact function name,
  # by Alembic itself inspecting the module, never by a literal reference in our own code.
  # `upgrade` isn't here -- `command.upgrade(...)` already reads as a use to vulture.
  "down_revision",
  "branch_labels",
  "depends_on",
  "downgrade",
  "isolation_level",  # sqlite api is used internally
  "PLUGINS",  # used when configuring custom dlboard plugins in the server
  # `serve/telemetry` `Attributes` fields are only ever read through `dataclasses.fields()` (to name the label),
  # never by a `.reason` vulture can see.
  "reason"
]
min_confidence = 60
paths = ["dlboard/"]
sort_by_size = true
